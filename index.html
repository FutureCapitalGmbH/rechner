<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Capital – Haushaltsrechner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0f14;
  --card: #151921;
  --card2: #1a1f2b;
  --input-bg: #1e2433;
  --border: #2a3040;
  --divider: #222838;
  --text: #e8ecf4;
  --label: #8892a8;
  --muted: #6b7590;
  --accent: #4f8eff;
  --green: #34d399;
  --red: #f87171;
  --gold: #fbbf24;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
  padding: 24px 16px;
}
.mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
.container { max-width: 860px; margin: 0 auto; }
.header {
  margin-bottom: 32px;
  display: flex;
  align-items: center;
  gap: 20px;
}
.header img { height: 40px; flex-shrink: 0; }
.header-text { flex: 1; text-align: center; }
.badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  background: linear-gradient(135deg, #4f8eff22, #34d39922);
  border: 1px solid #4f8eff33;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 6px;
}
h1 {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #e8ecf4, #8892a8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.subtitle { font-size: 13px; color: var(--muted); margin-top: 6px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.card {
  background: var(--card);
  border-radius: 14px;
  padding: 24px;
  border: 1px solid var(--border);
}
.card-title {
  font-size: 14px;
  font-weight: 700;
  margin: 0 0 20px;
  color: var(--label);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.field { margin-bottom: 16px; }
.field-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--label);
  margin-bottom: 5px;
}
.field-hint {
  font-weight: 400;
  text-transform: none;
  letter-spacing: 0;
  opacity: 0.6;
  margin-left: 6px;
  font-size: 10px;
}
.input-wrap { position: relative; }
.input-wrap input {
  width: 100%;
  padding: 10px 36px 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
  background: var(--input-bg);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.input-wrap input:focus { border-color: var(--accent); }
.input-suffix {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  pointer-events: none;
}
.person-btns { display: flex; gap: 6px; }
.person-btn {
  flex: 1;
  padding: 10px 0;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: var(--input-bg);
  color: var(--text);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'JetBrains Mono', monospace;
}
.person-btn.active {
  border: 2px solid var(--accent);
  background: #4f8eff22;
  color: var(--accent);
}
.result-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 10px 0;
  border-bottom: 1px solid var(--divider);
}
.result-row.sub {
  padding: 4px 0;
  border-bottom: none;
}
.result-row .rl {
  font-size: 13px;
  color: var(--text);
  font-weight: 500;
}
.result-row.sub .rl {
  font-size: 12px;
  color: var(--muted);
  font-weight: 400;
  padding-left: 12px;
}
.result-row .rv {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}
.result-row.sub .rv {
  font-size: 13px;
  color: var(--muted);
}
.result-row.highlight .rv {
  font-size: 18px;
  font-weight: 800;
  color: var(--green);
}
.result-row.highlight.negative .rv { color: var(--red); }
.right-col { display: flex; flex-direction: column; gap: 20px; }
.steuer-card {
  background: linear-gradient(135deg, #1a1f2b, #1e2433);
  border-radius: 14px;
  padding: 24px;
  border: 1px solid #fbbf2444;
}
.steuer-title {
  font-size: 14px;
  font-weight: 700;
  margin: 0 0 16px;
  color: #fbbf24;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.steuer-sub { font-size: 11px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
.status-badge {
  border-radius: 14px;
  padding: 18px 24px;
  text-align: center;
}
.status-icon { font-size: 22px; margin-bottom: 4px; }
.status-text { font-size: 14px; font-weight: 700; }
.auto-toggle {
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: all 0.2s;
}
.auto-display {
  padding: 10px 14px;
  border: 1.5px solid #4f8eff44;
  border-radius: 8px;
  background: #4f8eff0c;
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 600;
  color: #4f8eff;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.auto-display-hint {
  font-size: 10px;
  font-weight: 500;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
}
.hinweise {
  margin-top: 24px;
  padding: 16px 20px;
  background: var(--card2);
  border-radius: 10px;
  border: 1px solid var(--divider);
}
.hinweise-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.hinweise-text { font-size: 12px; color: var(--muted); line-height: 1.7; }
.divider { margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--divider); }
.toggle-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.formula-hint { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
@media (max-width: 700px) {
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>

function schaetzeGrenzsteuersatz(nettoMonat) {

  else if (nj <= 35000) bj = nj * 1.52;
  else if (nj <= 45000) bj = nj * 1.60;

  else if (nj <= 70000) bj = nj * 1.75;

  const s = state;
  const gsAuto = schaetzeGrenzsteuersatz(s.netto);
  const gs = s.steuerManuell ? s.grenzsteuersatzManuell : gsAuto;
  const { band, kosten } = getLebenshaltung(s.netto, s.personen);
  const anrechenbar = s.kaltmieteinnahmen * 0.75;
  const bankfrei = s.netto * 0.09;
  const ausgaben = kosten + s.kaltmiete + s.bewirtschaftung + s.privatkredit + s.immokredit + bankfrei;
  const einnahmen = s.netto + anrechenbar;
  const ueberschuss = einnahmen - ausgaben;
  const volumen = ueberschuss > 0 ? ueberschuss * 12 * 18 : 0;
  const mietNeukaufJ = volumen * 0.04;
  const zinsenJ = volumen * 0.045;
  const afaJ = volumen * 0.035;
  const verwJ = 300;
  const werbung = zinsenJ + afaJ + verwJ;
  const verlust = werbung - mietNeukaufJ;
  const steuerJ = verlust > 0 ? verlust * (gs / 100) : 0;

  return {
    gsAuto, gs, band, kosten, anrechenbar, bankfrei, ausgaben, einnahmen,
    ueberschuss, volumen, mietNeukaufJ, mietNeukaufM: mietNeukaufJ / 12,
    zinsenJ, afaJ, verwJ, werbung, verlust, steuerJ, steuerM: steuerJ / 12
  };
}

function row(label, value, cls = "") {
  return `<div class="result-row ${cls}"><span class="rl">${label}</span><span class="rv">${value}</span></div>`;
}

function update() {
  const r = berechne();
  const s = state;

  const mietRow = s.kaltmieteinnahmen > 0 ? row('Anrechenbare Mieteinnahmen (75%)', fmt(r.anrechenbar), 'sub') : '';
  const bewRow = s.bewirtschaftung > 0 ? row('Bewirtschaftung Eigenheim', fmt(s.bewirtschaftung), 'sub') : '';
  const privRow = s.privatkredit > 0 ? row('Privatkreditraten', fmt(s.privatkredit), 'sub') : '';
  const immoRow = s.immokredit > 0 ? row('Immobilienkreditraten (Bestand)', fmt(s.immokredit), 'sub') : '';

  const statusBg = r.ueberschuss >= 200 ? '#34d39915' : r.ueberschuss >= 0 ? '#fbbf2415' : '#f8717115';
  const statusBorder = r.ueberschuss >= 200 ? '#34d39944' : r.ueberschuss >= 0 ? '#fbbf2444' : '#f8717144';
  const statusColorHex = r.ueberschuss >= 200 ? '#34d399' : r.ueberschuss >= 0 ? '#fbbf24' : '#f87171';
  const statusIcon = r.ueberschuss >= 200 ? '✅' : r.ueberschuss >= 0 ? '⚠️' : '❌';
  const statusText = r.ueberschuss >= 200 ? 'Kunde kommt in Frage' : r.ueberschuss >= 0 ? 'Grenzfall – genauer prüfen' : 'Kunde kommt nicht in Frage';
  const volBorder = r.volumen > 0 ? '1px solid #34d39944' : '1px solid var(--border)';

  document.getElementById('results').innerHTML = `
        <div class="card">
          <h2 class="card-title" style="margin-bottom:16px">Ergebnisse</h2>
          ${row('Ermitteltes Einkommensband', r.band)}
          ${row('Lebenshaltungskosten laut Tabelle', fmt(r.kosten))}
          ${row('Kaltmiete', fmt(s.kaltmiete), 'sub')}
          ${mietRow}${bewRow}${privRow}${immoRow}
          ${row('Bankfreibehalt (9% vom Einkommen)', fmt(r.bankfrei), 'sub')}
          ${row('Summe Ausgaben (für Bank)', fmt(r.ausgaben))}
          <div style="height:12px"></div>
          ${row('Überschuss / Restbudget', fmt(r.ueberschuss), 'highlight' + (r.ueberschuss < 0 ? ' negative' : ''))}
        </div>

        <div class="card" style="border:${volBorder}">
          <h2 class="card-title" style="margin-bottom:16px">Mögliches Volumen</h2>
          ${row('mögliches Volumen ca.', fmt(r.volumen), 'highlight' + (r.volumen <= 0 ? ' negative' : ''))}
          <p class="formula-hint">= Überschuss (${fmt(r.ueberschuss)}) × 12 × 18</p>
        </div>

        <div class="steuer-card">
          <h2 class="steuer-title">⚡ Mögliche Steuerersparnis</h2>
          <p class="steuer-sub">Kaufpreis ${fmt(r.volumen)} · Steuersatz ${r.gs}% · Mietrendite 4%</p>
          ${row('Zinsen (4,5%)', fmt(r.zinsenJ) + ' /J', 'sub')}
          ${row('AfA (3,5%)', fmt(r.afaJ) + ' /J', 'sub')}
          ${row('Verwaltung (25€ × 12)', fmt(r.verwJ) + ' /J', 'sub')}
          ${row('= Werbungskosten', fmt(r.werbung) + ' /J')}
          ${row('– Mieteinnahmen (4% Rendite)', fmt(r.mietNeukaufJ) + ' /J')}
          ${row('= Steuerlicher Verlust', fmt(r.verlust) + ' /J')}
          <div style="height:12px"></div>
          ${row('Mögliche Steuerersparnis', fmt(r.steuerJ) + ' /Jahr', 'highlight')}
          ${row('davon monatlich', fmt(r.steuerM), 'sub')}
        </div>

        <div class="status-badge" style="background:${statusBg};border:1px solid ${statusBorder}">
          <div class="status-icon">${statusIcon}</div>
          <div class="status-text" style="color:${statusColorHex}">${statusText}</div>
        </div>
  `;

  // Update auto steuersatz display if in auto mode
  const autoDisplay = document.getElementById('steuer-display');
  if (autoDisplay && !s.steuerManuell) {
    autoDisplay.innerHTML = `<span>${r.gsAuto}%</span><span class="auto-display-hint">geschätzt bei ${fmt(s.netto)} netto</span>`;
  }

  // Update person buttons
  document.querySelectorAll('.person-btn').forEach(btn => {
    const n = parseInt(btn.dataset.n);
    btn.classList.toggle('active', n === s.personen);
  });
}

function setVal(key, val) {
  state[key] = val;
  update();
}

function toggleSteuerModus() {
  const r = berechne();
  if (!state.steuerManuell) state.grenzsteuersatzManuell = r.gsAuto;
  state.steuerManuell = !state.steuerManuell;
  renderSteuerToggle();
  update();
}

function renderSteuerToggle() {
  const s = state;
  const r = berechne();
  const container = document.getElementById('steuer-toggle-area');
  const toggleBtnStyle = s.steuerManuell
    ? 'border:1px solid #fbbf2444;background:#fbbf2418;color:#fbbf24'
    : 'border:1px solid #4f8eff44;background:#4f8eff18;color:#4f8eff';

  container.innerHTML = `
    <div class="toggle-row">
      <label class="field-label" style="margin-bottom:0">Grenzsteuersatz</label>
      <button class="auto-toggle" style="${toggleBtnStyle}" onclick="toggleSteuerModus()">
        ${s.steuerManuell ? '✏️ Manuell' : '⚡ Auto'}
      </button>
    </div>
    ${s.steuerManuell
      ? `<div class="input-wrap">
           <input type="number" value="${s.grenzsteuersatzManuell}" step="1" min="0" max="45" style="border-color:#fbbf2466" oninput="setVal('grenzsteuersatzManuell',parseFloat(this.value)||0)">
           <span class="input-suffix">%</span>
         </div>`
      : `<div class="auto-display" id="steuer-display"><span>${r.gsAuto}%</span><span class="auto-display-hint">geschätzt bei ${fmt(s.netto)} netto</span></div>`
    }
  `;
}

function initApp() {
  const s = state;

  document.getElementById('app').innerHTML = `
    <div class="header">
      <img src="${LOGO}" alt="Future Capital">
      <div class="header-text">
        <div class="badge">Setter-Tool</div>
        <h1>Haushaltsrechner</h1>
        <p class="subtitle">Schnelle Einschätzung ob ein Kunde in Frage kommt</p>
      </div>
    </div>
    <div class="grid">
      <div class="card">
        <h2 class="card-title">Eingaben</h2>
        <div class="field">
          <label class="field-label">Netto-Haushaltseinkommen</label>
          <div class="input-wrap">
            <input type="number" value="${s.netto}" step="100" min="0" oninput="setVal('netto',parseFloat(this.value)||0)">
            <span class="input-suffix">€</span>
          </div>
        </div>
        <div class="field">
          <label class="field-label">Haushaltsgröße (Personen/Einheiten)</label>
          <div class="person-btns">
            ${[1,2,3,4,5].map(n => `<button class="person-btn ${n===s.personen?'active':''}" data-n="${n}" onclick="setVal('personen',${n});this.parentElement.querySelectorAll('.person-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active')">${n}</button>`).join('')}
          </div>
        </div>
        <div class="field">
          <label class="field-label">Kaltmiete<span class="field-hint">mind. 450€</span></label>
          <div class="input-wrap">
            <input type="number" value="${s.kaltmiete}" step="50" min="0" oninput="setVal('kaltmiete',parseFloat(this.value)||0)">
            <span class="input-suffix">€</span>
          </div>
        </div>
        <div class="field">
          <label class="field-label">Kaltmieteinnahmen<span class="field-hint">75% anrechenbar</span></label>
          <div class="input-wrap">
            <input type="number" value="${s.kaltmieteinnahmen}" step="50" min="0" oninput="setVal('kaltmieteinnahmen',parseFloat(this.value)||0)">
            <span class="input-suffix">€</span>
          </div>
        </div>
        <div class="field">
          <label class="field-label">Bewirtschaftungskosten Eigenheim<span class="field-hint">mind. 450€</span></label>
          <div class="input-wrap">
            <input type="number" value="${s.bewirtschaftung}" step="50" min="0" oninput="setVal('bewirtschaftung',parseFloat(this.value)||0)">
            <span class="input-suffix">€</span>
          </div>
        </div>
        <div class="field">
          <label class="field-label">Privatkreditraten<span class="field-hint">falls vorhanden</span></label>
          <div class="input-wrap">
            <input type="number" value="${s.privatkredit}" step="50" min="0" oninput="setVal('privatkredit',parseFloat(this.value)||0)">
            <span class="input-suffix">€</span>
          </div>
        </div>
        <div class="field">
          <label class="field-label">Immobilienkreditraten (Bestand)<span class="field-hint">falls vorhanden</span></label>
          <div class="input-wrap">
            <input type="number" value="${s.immokredit}" step="50" min="0" oninput="setVal('immokredit',parseFloat(this.value)||0)">
            <span class="input-suffix">€</span>
          </div>
        </div>
        <div class="divider">
          <div class="field" id="steuer-toggle-area"></div>
        </div>
      </div>

      <div class="right-col" id="results"></div>
    </div>

    <div class="hinweise">
      <div class="hinweise-title">Hinweise</div>
      <div class="hinweise-text">Kaltmiete 100% als Ausgabe · Kaltmieteinnahmen zu 75% anrechenbar · Bankfreibehalt 9% · Volumen = Überschuss × 12 × 18 · Mietrendite Neukauf 4% · AfA 3,5% · Zins 4,5% · Verwaltung 25€/Monat · Steuerersparnis pro Jahr</div>
    </div>
  `;

  renderSteuerToggle();
  update();
}

function field(label, key, value, suffix, step, hint) {
  const hintHtml = hint ? `<span class="field-hint">${hint}</span>` : '';
  return `
    <div class="field">
      <label class="field-label">${label}${hintHtml}</label>
      <div class="input-wrap">
        <input type="number" value="${value}" step="${step}" min="0"
          oninput="setVal('${key}',parseFloat(this.value)||0)">
        <span class="input-suffix">${suffix}</span>
      </div>
    </div>`;
}

initApp();
</script>
</body>
</html>
